name: CI

# Runs on every push and pull request. Note this does not gate Vercel:
# Vercel deploys main on push regardless. Treat a red run as "fix or revert".
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Vercel project
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: SEO assertions
        run: |
          npx next start -p 3300 &
          for i in $(seq 1 30); do curl -sf http://localhost:3300 > /dev/null && break; sleep 1; done
          npm run seo:check -- http://localhost:3300

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test
        env:
          NEXT_DIST_DIR: .next # reuse the build above

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
